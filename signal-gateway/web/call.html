<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gateway call</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    #local { position: absolute; right: 16px; top: 16px; width: 28vw; max-width: 180px; height: auto; border-radius: 12px; z-index: 2; }
    #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 16px 36px; background: linear-gradient(transparent, rgba(0,0,0,.75)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #status { opacity: .85; }
    button { border: 0; border-radius: 999px; padding: 14px 28px; font-size: 1rem; font-weight: 700; background: #e5484d; color: #fff; }
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div id="hud">
    <div id="title">Connecting…</div>
    <div id="status">Preparing media</div>
    <button id="hangup" type="button">Hang up</button>
  </div>
  <script src="/static/call.js"></script>
</body>
</html>
